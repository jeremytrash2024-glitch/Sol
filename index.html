<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sol, callisthénie au poids du corps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#12171E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#E4E7E5;--surf:#F6F7F5;--ink:#18212C;--mute:#566270;--line:#C6CCC9;
  --acc:#2444D6;--acc-ink:#FFFFFF;--mark:#F0B400;--mark-ink:#18212C;--ok:#1C8556;--limb:#4A5766;
  --disp:"Big Shoulders Display","Big Shoulders","Roboto Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;
    --bg:#12171E;--surf:#1C232D;--ink:#ECF1F4;--mute:#96A3B0;--line:#2F3945;
    --acc:#8AA2FF;--acc-ink:#0D1320;--mark:#F4C23A;--mark-ink:#12171E;--ok:#5BD19A;--limb:#B4C0CC;}
}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#12171E;--surf:#1C232D;--ink:#ECF1F4;--mute:#96A3B0;--line:#2F3945;
  --acc:#8AA2FF;--acc-ink:#0D1320;--mark:#F4C23A;--mark-ink:#12171E;--ok:#5BD19A;--limb:#B4C0CC;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding:16px 18px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.brand{font:800 30px/1 var(--disp);letter-spacing:.01em}
.link{color:var(--mute);font-weight:500;font-size:15px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.when{color:var(--mute);font-weight:500;font-size:15px}
.title{font:800 clamp(40px,13vw,68px)/.9 var(--disp);letter-spacing:-.005em;margin:6px 0 10px;text-wrap:balance}
.meta{color:var(--mute);font-size:15px}
.stage{margin:14px -18px 0;background:var(--surf);border-block:1px solid var(--line);padding:6px 18px 0}
.fig{display:block;width:100%;height:auto}
.fig .g{stroke:var(--line);stroke-width:1.2}
.fig{--shirt:#2A8795;--short:#5E6B3F;--shoe:#4A4F57}
.fig.fem{--shirt:#D6457F;--short:#22325A;--shoe:#15181D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fig{--shirt:#3A9DAB;--short:#7F8D57;--shoe:#68707B}:root:not([data-theme="light"]) .fig.fem{--shirt:#F58BB5;--short:#4A64A8;--shoe:#3A4049}}
:root[data-theme="dark"] .fig{--shirt:#3A9DAB;--short:#7F8D57;--shoe:#68707B}
:root[data-theme="dark"] .fig.fem{--shirt:#F58BB5;--short:#4A64A8;--shoe:#3A4049}
.fig .hr{fill:none;stroke:#7A5540;stroke-width:2.2;stroke-linecap:round}
.fig .hc{fill:#7A5540}
.fig polygon,.fig path.t,.fig path.s{stroke-width:.9;stroke-linejoin:round}
.fig .l{fill:var(--limb);stroke:var(--limb)}
.fig .t{fill:var(--shirt);stroke:var(--shirt)}
.fig .s{fill:var(--short);stroke:var(--short)}
.fig .ft{stroke:var(--shoe);stroke-width:2.5;stroke-linecap:round}
.fig .bk{opacity:.75}
.fig.front .bk{opacity:1}
.fig.front .bk .l{fill:color-mix(in srgb,var(--limb) 88%,#000);stroke:color-mix(in srgb,var(--limb) 88%,#000)}
.fig .w{stroke:var(--mute);stroke-width:2.2;stroke-linecap:round}
.fig .rope{stroke:#E0782F;stroke-width:1.6;stroke-linecap:round}
.fig .band{stroke-width:1;stroke-dasharray:none}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;border-radius:14px;background:var(--acc);color:var(--acc-ink);font:800 22px/1.05 var(--disp);letter-spacing:.02em;padding:8px 16px;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.sm{min-height:48px;font-size:20px}
.btn:active{transform:translateY(1px)}
.cta{margin-top:16px}

/* échelle de la semaine : deux rails, sept barreaux */
.ladder{margin:26px 0 6px;position:relative;display:grid;grid-template-columns:repeat(7,1fr);padding:10px 0}
.ladder::before,.ladder::after{content:"";position:absolute;left:0;right:0;height:4px;border-radius:2px;background:var(--ink)}
.ladder::before{top:10px}.ladder::after{bottom:34px}
.rung{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:92px}
.rung i{display:block;width:8px;height:58px;border-radius:4px;background:var(--line)}
.rung.done i{background:var(--mark)}
.rung.cur i{background:var(--acc);width:12px}
.rung span{font-size:13px;color:var(--mute);font-weight:500}
.rung.cur span{color:var(--ink);font-weight:600}

.h2{font:800 28px/1 var(--disp);margin:26px 0 8px}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--line);min-height:60px}
.row .th{flex:0 0 64px;width:64px}
.row .nm{flex:1;font-weight:500}
.row .am{font:800 22px/1 var(--disp);white-space:nowrap}
.note{color:var(--mute);font-size:15px;margin-top:10px;max-width:60ch}

.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.cell{aspect-ratio:1/1.25;border-radius:10px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--surf)}
.cell b{font:800 22px/1 var(--disp)}
.cell small{font-size:10px;color:var(--mute);line-height:1.1;text-align:center}
.cell.done{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.cell.done small{color:var(--mark-ink)}
.cell.cur{border:2.5px solid var(--acc)}
.cell.off{background:transparent;border-style:dashed}
.wk{font-weight:600;font-size:15px;margin:16px 0 8px;color:var(--mute)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-top:8px}
.stat{padding:14px 0}
.stat+.stat{border-left:1px solid var(--line);padding-left:14px}
.stat b{display:block;font:800 46px/1 var(--disp)}
.stat span{font-size:14px;color:var(--mute)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 12px}
.form label{font-size:14px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.form input,select{font:600 18px var(--body);color:var(--ink);background:var(--surf);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:48px}
.hist{width:100%;border-collapse:collapse;font-size:15px;margin-top:12px}
.hist th{text-align:left;font-weight:500;color:var(--mute);padding:6px 0;border-bottom:1px solid var(--line)}
.hist td{padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{display:flex;align-items:center;justify-content:center;min-height:60px;color:var(--mute);text-decoration:none;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;border-top:3px solid transparent;margin-top:-1px}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:600;border-top-color:var(--acc)}

.back{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.55);display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-width:560px;margin:0 auto;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}

.sheet h3{font:800 38px/.95 var(--disp);margin-bottom:6px}
.sheet .stage{margin-top:12px;margin-bottom:14px}
.set{display:flex;flex-direction:column;gap:6px;margin:14px 0;font-weight:500}
.x{float:right;min-width:44px;min-height:44px;color:var(--mute);font-weight:500;text-decoration:underline;text-underline-offset:3px}

.play{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}

.play.rest .btn{background:var(--acc-ink);color:var(--acc)}
.play.rest .btn.alt{background:transparent;color:var(--acc-ink);border-color:var(--acc-ink)}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 10px}
.play.rest .pbar{background:rgba(255,255,255,.25)}
.pbar i{display:block;height:100%;background:var(--mark);transition:width .3s}
.phead{display:flex;justify-content:space-between;align-items:center}
.pmid{flex:1;display:flex;flex-direction:column;justify-content:safe center;min-height:0;overflow-y:auto;padding-bottom:10px}
.pname{font:800 clamp(34px,10vw,48px)/.95 var(--disp);margin-top:4px;text-wrap:balance}
.cue{color:var(--mute);font-size:15px;margin-top:6px;max-width:60ch}
.big{font:800 clamp(64px,min(36vw,13vh),180px)/.85 var(--disp);font-variant-numeric:tabular-nums;margin:6px 0 2px}
.big small{font-size:.32em;font-weight:600;margin-left:6px}
.pact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pact .wide{grid-column:1/-1}
.play .fig{max-height:24vh}
.feel{display:grid;gap:10px;margin-top:18px}
.seg{display:grid;gap:8px;margin:8px 0 18px}
.seg.r3{grid-template-columns:repeat(3,1fr)}.seg.r2{grid-template-columns:repeat(2,1fr)}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;background:var(--surf);min-height:50px;font-weight:600}
.opt small{display:block;color:var(--mute);font-weight:400;font-size:14px;line-height:1.35;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.lab{font-weight:600;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
a.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 13px;border:1.5px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;background:var(--surf)}
a.chip small{color:var(--mute);font-weight:500}
a.chip[aria-current="page"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
a.chip[aria-current="page"] small{color:var(--acc-ink)}
.sheet .chips{margin:10px 0 0}
.plan{margin:10px 0 16px;padding-left:20px}.plan li{margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.pbar i{transition:none}}
</style>
</head>

const KEYS=["hd","sh","hp","k1","f1","k2","f2","e1","w1","e2","w2"];
function fullPose(name){
  const mir=name.endsWith("~"); const p=POSES[mir?name.slice(0,-1):name];
  let o={...p};
  o.k2=p.k2||[p.k1[0]+1.6,p.k1[1]]; o.f2=p.f2||[p.f1[0]+1.6,p.f1[1]];
  o.e2=p.e2||[p.e1[0]-1.2,p.e1[1]+.6]; o.w2=p.w2||[p.w1[0]-1.2,p.w1[1]+.6];
  if(mir){const m={};for(const k of KEYS)m[k]=[100-o[k][0],o[k][1]];
    o={hd:m.hd,sh:m.sh,hp:m.hp,k1:m.k2,f1:m.f2,k2:m.k1,f2:m.f1,e1:m.e2,w1:m.w2,e2:m.e1,w2:m.w1,fl:!p.fl,fv:p.fv,sw:p.sw};}
  return o;
}

  climbers:{n:"Grimpeur",c:"cardio",t:"s",q:30,fr:["climbA","climbB"],sp:400,cue:"En planche bras tendus, ramène un genou puis l’autre vers la poitrine. Les fesses restent basses."},
  burpee:{n:"Burpees",c:"cardio",t:"r",q:8,fr:["stand","crouch","plank","crouch","jump"],sp:550,cue:"Mains au sol, jette les pieds en planche, reviens, saute. Garde un rythme que tu peux tenir."},
  chien:{n:"Chien tête en bas vers cobra",c:"mob",t:"s",q:60,fr:["pike","cobra"],sp:2400,cue:"Passe lentement du V inversé au cobra, bassin vers le sol et poitrine ouverte. Une respiration par passage."},
  grande:{n:"Grande fente avec rotation",c:"mob",t:"s",q:60,fr:["wgsDown","wgs"],sp:2200,half:1,cue:"En fente basse, une main au sol, ouvre l’autre bras vers le plafond en le suivant du regard. Change de côté à mi-temps."},
  profond:{n:"Squat profond tenu",c:"mob",t:"s",q:45,fr:["squatDeep"],cue:"Accroupi talons au sol, coudes qui écartent les genoux, dos long. Tiens-toi à un meuble si tu bascules."},
  enfant:{n:"Posture de l’enfant",c:"mob",t:"s",q:60,fr:["child"],cue:"Fesses vers les talons, bras loin devant, front vers le sol. Laisse le dos s’allonger en respirant lentement."},
  mur:{n:"Marche au mur",c:"fig",t:"s",q:20,fr:["wallWalk"],wall:33,cue:"Dos au mur, mains au sol, monte les pieds le long du mur en rapprochant les mains. Arrête-toi là où tu restes gainé. C’est le début de l’équilibre sur les mains."},
  corbeau:{n:"Corbeau",c:"fig",t:"s",q:15,fr:["crouch","crow"],sp:2000,cue:"Accroupi, mains au sol, cale les genoux sur l’arrière des bras et bascule doucement vers l’avant jusqu’à décoller les pieds. Mets un coussin devant toi. Le temps compte les essais, pas une tenue parfaite."},
  tuck:{n:"Soulevé groupé",c:"fig",t:"s",q:10,fr:["sit","tuck"],sp:1800,cue:"Assis, mains à plat près des hanches, pousse le sol pour décoller les fesses, genoux groupés. Les pieds peuvent rester posés au début."},
  lsit:{n:"Équerre",c:"fig",t:"s",q:8,fr:["tuck","lsit"],sp:1800,cue:"Depuis le soulevé groupé, tends les jambes devant toi. Objectif de fin de cycle : quand le groupé tient 20 secondes, essaie une jambe puis les deux."},
  chienT:{n:"Chien tête en bas tenu",c:"etir",t:"s",q:40,fr:["pike"],cue:"Mollets et arrière des cuisses. Pousse le sol loin de toi, fesses vers le plafond, et cherche à poser les talons. Tu peux pédaler doucement d’un pied sur l’autre."},
  pinceDebout:{n:"Pince debout",c:"etir",t:"s",q:40,fr:["stand","foldStand"],sp:2600,cue:"Arrière des cuisses et bas du dos. Laisse le buste tomber vers les pieds, nuque relâchée, genoux déverrouillés. Ne force pas, laisse le poids de la tête faire le travail."},
  fenteBasse:{n:"Fente basse, genou au sol",c:"etir",t:"s",q:60,half:1,fr:["lowLunge"],cue:"Avant de la hanche et de la cuisse. Genou arrière posé, avance le bassin sans cambrer, bras vers le plafond. Change de jambe au double bip."},
  pince:{n:"Pince assise",c:"etir",t:"s",q:40,fr:["sit","fold"],sp:2600,cue:"Arrière des cuisses. Assis jambes tendues, penche-toi depuis les hanches, dos long, mains vers les pieds. Plie un peu les genoux si le dos s’arrondit trop."},
  fessier:{n:"Fessiers, jambe croisée",c:"etir",t:"s",q:60,half:1,fr:["fig4"],cue:"Sur le dos, pose une cheville sur le genou opposé et ramène les deux jambes vers toi. Ça tire dans la fesse de la jambe croisée. Change de côté au double bip."},
  cobraT:{n:"Cobra tenu",c:"etir",t:"s",q:30,fr:["cobra"],cue:"Abdominaux et avant des hanches. Bassin au sol, épaules loin des oreilles. Garde les coudes pliés si le bas du dos pince."},
  chiot:{n:"Chiot",c:"etir",t:"s",q:40,fr:["puppy"],cue:"Épaules, pectoraux et grand dorsal. À genoux, hanches au-dessus des genoux, marche les mains loin devant et laisse la poitrine fondre vers le sol."},
  triceps:{n:"Triceps, coude au plafond",c:"etir",t:"s",q:40,half:1,fr:["tri"],cue:"Monte un coude au plafond, main entre les omoplates, et l’autre main appuie doucement sur ce coude. Côtes rentrées. Change de bras au double bip."},
  dips:{n:"Dips sur chaise",c:"haut",t:"r",q:8,fr:["dipUp","dipLow"],prop:"chair",cx:27,cue:"Mains sur le bord de l’assise, doigts vers l’avant, fesses juste devant la chaise. Plie les coudes vers l’arrière jusqu’à 90°, pas plus bas, puis repousse. Cale la chaise contre un mur. Plie les genoux pour alléger."},
  decline:{n:"Pompes pieds surélevés",c:"haut",t:"r",q:6,fr:["decl","declLow"],prop:"chair",cx:20,cue:"Pieds sur l’assise, mains au sol. Plus de poids sur les épaules et le haut des pectoraux qu’une pompe classique. Garde le bassin aligné."},
  bulgare:{n:"Squat bulgare",c:"jambes",t:"r",q:8,fr:["bulgUp","bulgLow"],prop:"chair",cx:22,cue:"Un pied posé derrière toi sur la chaise, descends à la verticale sur la jambe avant. Fais le nombre indiqué sur chaque jambe."},
  rowing:{n:"Rowing sous table",c:"dos",t:"r",q:8,fr:["rowLow","rowUp"],prop:"table",cue:"Allongé sous une table lourde et stable, attrape le bord, corps gainé, talons au sol. Tire la poitrine vers la table. Trop dur ? Plie les genoux, pieds à plat : plus le corps est debout, plus c’est facile. Teste la table avant : si elle bouge ou bascule, laisse tomber cet exercice."},
  suspension:{n:"Suspension à la barre",c:"dos",t:"s",q:20,fr:["hang"],prop:"bar",cue:"Mains en pronation, un peu plus écartées que les épaules, pieds décollés. Laisse-toi pendre, puis éloigne un peu les épaules des oreilles. Lâche avant que la prise ne glisse : c’est l’avant-bras qui apprend à tenir."},
  omoplates:{n:"Tirages d’omoplates",c:"dos",t:"r",q:8,fr:["hang","hangScap"],prop:"bar",sp:1300,cue:"Suspendu, bras tendus, coudes qui ne plient pas : abaisse et serre les omoplates pour monter de quelques centimètres, puis relâche doucement. C’est le premier centimètre d’une traction."},
  negative:{n:"Tractions négatives",c:"dos",t:"r",q:4,fr:["pullTop","hang"],prop:"bar",sp:2600,cue:"Monte le menton au-dessus de la barre en t’aidant d’une chaise ou d’un petit saut, puis descends le plus lentement possible, 4 à 5 secondes, jusqu’aux bras tendus. Repose les pieds et recommence. Quand tu tiens 5 secondes à chaque fois, tente une vraie traction."},
  traction:{n:"Tractions",c:"dos",t:"r",q:4,fr:["hang","pullTop"],prop:"bar",sp:1500,cue:"Depuis la suspension, serre les omoplates puis tire les coudes vers les hanches jusqu’à passer le menton au-dessus de la barre. Redescends jusqu’aux bras tendus sans te laisser tomber. Si tu bloques avant le compte, finis la série en négatives."},
  genouxSusp:{n:"Relevés de genoux suspendu",c:"centre",t:"r",q:8,fr:["hang","hangKnee"],prop:"bar",sp:1200,cue:"Suspendu, épaules actives, monte les genoux vers la poitrine sans balancer, puis redescends lentement. Si le corps se balance, marque une pause bras tendus avant la suivante."},
  archer:{n:"Tractions archer",c:"dos",t:"r",q:4,even:1,fr:["hangWide","archerL","hangWide","archerL~"],prop:"bar",sp:1500,cue:"Mains très écartées. Tire vers une main en gardant l’autre bras presque tendu, qui glisse sur la barre et aide le moins possible. Redescends, puis l’autre côté. C’est la porte d’entrée de la traction à un bras."},
  typewriter:{n:"Tractions machine à écrire",c:"dos",t:"r",q:4,even:1,fr:["archerL","archerL~"],prop:"bar",sp:2200,cue:"Monte en traction large, puis, menton toujours au-dessus de la barre, glisse lentement vers une main, puis vers l’autre. Un aller compte pour une répétition. Si tu descends en route, arrête la série."},
  negUn:{n:"Négatives à un bras",c:"dos",t:"r",q:2,even:1,fr:["oneTop","oneHang"],prop:"bar",sp:3000,cue:"Monte à deux bras, lâche une main en haut et redescends sur l’autre le plus lentement possible, 3 à 5 secondes. Coude serré, épaule active. Si tu tombes d’un coup, reviens aux archers."},
  unAssist:{n:"Traction à un bras assistée",c:"dos",t:"r",q:2,even:1,fr:["oneTowelHang","oneTowel"],prop:"barT",sp:1800,cue:"Une main sur la barre, l’autre sur une corde ou une serviette passée par-dessus. Tire surtout avec le bras de la barre. Plus ta main descend sur la serviette, moins elle aide."},
  unBras:{n:"Traction à un bras",c:"fig",t:"r",q:2,even:1,fixq:1,fr:["oneHang","oneTop"],prop:"bar",sp:1800,cue:"Le sommet. Une seule tentative par bras, bien reposé, sans élan. Pieds serrés, fessiers et abdos contractés, tire le coude vers la hanche. Raté ? Fais une négative à un bras à la place : c’est comme ça qu’on y arrive, sur des mois."},
  pistol:{n:"Squat pistol",c:"jambes",t:"r",q:6,even:1,fr:["pistolUp","pistolLow"],sp:1700,cue:"Sur une jambe, l’autre tendue devant toi, bras devant pour l’équilibre. Descends jusqu’en bas, talon au sol, genou dans l’axe du pied, et remonte sans élan. Tiens un cadre de porte au début si besoin."},
  pompeArcher:{n:"Pompes archer",c:"haut",t:"r",q:6,even:1,fr:["archerP","archerPLow"],cue:"Mains très écartées. Descends vers une main pendant que l’autre bras reste tendu et ne fait que stabiliser. Remonte, puis l’autre côté."},
  pompeUn:{n:"Pompes à un bras",c:"haut",t:"r",q:4,even:1,fr:["oneP","onePLow"],cue:"Pieds écartés, une main au sol sous l’épaule, l’autre dans le dos. Gaine tout le corps pour que le bassin ne tourne pas. Trop dur ? Mains sur une chaise ou une marche."},
  atr:{n:"Équilibre contre le mur",c:"fig",t:"s",q:20,fr:["handstand"],wall:30,cue:"Mains à une vingtaine de centimètres du mur, monte les jambes et pose les talons au mur. Bras tendus, épaules qui poussent vers les oreilles, côtes rentrées. Avec le temps, décolle un talon puis l’autre."},
  frontLever:{n:"Front lever groupé",c:"fig",t:"s",q:8,fr:["flTuck"],prop:"barS",cue:"Suspendu, bras tendus, bascule le corps à l’horizontale, dos vers le sol, genoux serrés contre la poitrine. Tire la barre vers les hanches. Quand tu tiens 15 secondes, écarte un peu les genoux du buste."},
  pont1:{n:"Pont fessier sur une jambe",c:"jambes",t:"r",q:8,even:1,fr:["pont1Down","pont1Up"],cue:"Un pied au sol, l’autre jambe tendue dans le prolongement de la cuisse. Pousse dans le talon d’appui et monte le bassin sans qu’il penche d’un côté. Serre une seconde en haut. Fais tout un côté, puis l’autre."},
  roue:{n:"Pont complet",c:"dos",t:"r",q:4,fr:["wheelDown","wheel"],sp:2200,cue:"Sur le dos, pieds près des fesses, mains à plat de chaque côté de la tête, doigts vers les épaules. Pousse dans les mains et les pieds pour monter le bassin, puis tends les bras. Regarde le sol entre tes mains. Redescends doucement sur le haut du dos, jamais sur la tête. Si les bras ne se tendent pas, reste sur le sommet du crâne et pousse un peu plus à chaque séance."},
  pompeP:{n:"Pompes sur poignées",c:"haut",t:"r",q:8,fr:["plankP","plankPLow"],prop:"poign",px:71,cue:"Poignées sous les épaules, bien parallèles. Descends jusqu’à ce que la poitrine passe sous le niveau des mains : c’est tout l’intérêt, plus d’amplitude et des poignets droits. Remonte en gardant le corps gainé."},
  tuckP:{n:"Soulevé groupé sur poignées",c:"fig",t:"s",q:10,fr:["sitP","tuckP"],prop:"poign",px:50,sp:1800,cue:"Assis entre les poignées, bras tendus, pousse fort vers le bas pour décoller les fesses, genoux groupés. Les poignées te donnent la hauteur qui manque au sol : c’est la meilleure façon d’apprendre l’équerre."},
  lsitP:{n:"Équerre sur poignées",c:"fig",t:"s",q:8,fr:["tuckP","lsitP"],prop:"poign",px:50,sp:1800,cue:"Depuis le soulevé groupé sur poignées, tends une jambe puis l’autre devant toi. Épaules basses, loin des oreilles, bras verrouillés."},
  tirageE:{n:"Tirage vertical à l’extenseur",c:"dos",t:"r",q:10,fr:["exHigh","exDown"],need:"elast",band:[["w1","w2"]],sp:1400,cue:"Extenseur tenu bras tendus au-dessus de la tête. Écarte les mains en descendant les coudes vers les côtes, jusqu’à ce que les tubes passent devant le haut de ta poitrine. Remonte lentement, sans laisser claquer."},
  rowE:{n:"Rowing à l’extenseur",c:"dos",t:"r",q:10,fr:["rowEDown","rowEUp"],need:"elast",band:[["f1","w1"]],sp:1400,cue:"Pieds sur le milieu des tubes, buste penché à 45°, dos plat. Tire les poignées vers les hanches en serrant les omoplates, coudes près du corps. Plus tes pieds sont écartés sur les tubes, plus c’est dur."},
  ecarteE:{n:"Écarté à l’extenseur",c:"dos",t:"r",q:12,fr:["exFront","exOpen"],need:"elast",band:[["w1","w2"]],sp:1300,cue:"Bras tendus devant la poitrine, ouvre-les sur les côtés jusqu’à former un T, en serrant les omoplates. Reviens lentement. Le meilleur contrepoids aux pompes pour la posture."},
  arcE:{n:"Tir à l’arc à l’extenseur",c:"dos",t:"r",q:8,even:1,fr:["arcA","arcB","arcA","arcA~","arcB~","arcA~"],need:"elast",band:[["w1","w2"]],sp:1100,cue:"Un bras tendu sur le côté à hauteur d’épaule, l’autre main près de la première. Tire la poignée jusqu’à ton épaule, coude haut, comme on bande un arc, et serre l’omoplate. Le bras tendu ne bouge pas. Reviens lentement, puis l’autre côté. C’est le geste de la traction archer, à l’horizontale."},
  ruadeE:{n:"Ruade à l’extenseur",c:"jambes",t:"r",q:10,even:1,fr:["bdA","ruB"],need:"elast",band:[["f1","f2"]],sp:1300,cue:"À quatre pattes, une poignée bloquée sous le pied de la jambe d’appui, l’autre autour du pied qui travaille. Pousse ce pied vers l’arrière jusqu’à ce que la jambe soit tendue dans l’axe du dos, sans creuser les reins. Serre la fesse une seconde en haut. Tout un côté, puis l’autre."},
  curlE:{n:"Curl à l’extenseur",c:"haut",t:"r",q:10,even:1,fr:["curlDown","curlUp"],need:"elast",band:[["f1","w1"]],sp:1300,cue:"Un pied sur une poignée, l’autre poignée en main, bras tendu. Plie le coude pour monter la main vers l’épaule, coude collé au corps, sans balancer le buste. Redescends lentement. Ça se fait aussi assis sur une chaise. Utile pour les premières tractions."},
  pompeG:{n:"Pompes sur les genoux",c:"haut",t:"r",q:8,fr:["kneePlank","kneePlankLow"],cue:"Genoux au sol, corps droit des genoux à la tête, fesses ni en l’air ni affaissées. Descends la poitrine entre les mains. Quand tu en fais 12 propres, passe aux pompes classiques."},
  pompeI:{n:"Pompes inclinées",c:"haut",t:"r",q:8,fr:["incl","inclLow"],prop:"chair",cx:67,flip:1,cue:"Mains sur le bord d’une chaise calée contre un mur, corps gainé. Plus les mains sont hautes, plus c’est facile : c’est la marche entre les genoux et les pompes au sol."},
  plancheG:{n:"Planche sur les genoux",c:"centre",t:"s",q:30,fr:["kneeForearm"],cue:"Avant-bras et genoux au sol, ligne droite des genoux aux épaules. Serre les fessiers et respire."},
  hollowG:{n:"Gainage creux, genoux pliés",c:"centre",t:"s",q:20,fr:["hollowTuck"],cue:"Sur le dos, épaules décollées, genoux à 90° au-dessus des hanches, bas du dos plaqué au sol. Plus tu éloignes les pieds, plus c’est dur."},
  genouxLev:{n:"Relevés de genoux",c:"centre",t:"r",q:10,fr:["legsDown","kneeTuck"],sp:1000,cue:"Sur le dos, ramène les genoux vers la poitrine puis retends les jambes sans poser les talons. La version douce des relevés de jambes."},
  jacksPas:{n:"Jacks sans saut",c:"cardio",t:"s",q:30,fr:["jackA","stepL","jackA","stepR"],sp:420,cue:"Un pas de côté en montant les bras, reviens, puis l’autre côté. Le rythme des jumping jacks, sans l’impact."},
  swing:{n:"Balancements de jambe",c:"ecart",t:"s",q:40,half:1,fr:["swingB","swingF"],sp:900,cue:"Une main contre un mur, balance une jambe d’avant en arrière, de plus en plus haut, sans forcer. C’est un échauffement, pas une tenue. Change de jambe au double bip."},
  demiGE:{n:"Demi-grand écart",c:"ecart",t:"s",q:60,half:1,fr:["halfUp","halfFold"],sp:3200,cue:"Genou arrière au sol, jambe avant tendue, orteils vers le plafond. Penche le buste depuis les hanches, dos long. Toutes les 20 secondes, appuie le talon contre le sol 5 secondes, relâche, puis descends un peu plus. Change de jambe au double bip."},
  pigeon:{n:"Pigeon",c:"ecart",t:"s",q:60,half:1,fr:["pigeonUp","pigeonFold"],sp:3200,cue:"Jambe avant pliée devant toi, jambe arrière tendue loin derrière. Garde le bassin de face, puis descends le buste sur la jambe avant. Ça étire la fesse et libère la hanche pour le grand écart avant. Change de côté au double bip."},
  geAvant:{n:"Grand écart avant, sur appuis",c:"ecart",t:"s",q:60,half:1,fr:["fsHigh","fsLow"],sp:3600,prop:"bloc",cue:"Mains sur deux piles de livres de chaque côté du bassin. Glisse les jambes vers l’avant et l’arrière jusqu’à sentir l’étirement, bassin de face. Les mains portent ton poids : tu ne t’assois jamais sur une douleur. Change de jambe au double bip."},
  papillon:{n:"Papillon",c:"ecart",t:"s",q:45,fr:["bflyA","bflyB"],sp:2400,cue:"Assis, plantes de pieds collées, talons près du bassin. Tiens tes pieds et laisse les genoux descendre vers le sol en expirant, sans appuyer dessus."},
  geAssis:{n:"Grand écart assis, inclinaisons",c:"ecart",t:"s",q:60,fr:["strSit","strL","strSit","strL~"],sp:2600,cue:"Assis, jambes tendues et écartées au maximum confortable, genoux et orteils vers le plafond. Penche-toi vers une jambe, reviens, puis vers l’autre. Dos long : mieux vaut un petit écart dos droit qu’un grand écart dos rond."},
  geDebout:{n:"Grand écart debout, mains au sol",c:"ecart",t:"s",q:45,fr:["wideStand","strFold"],sp:3000,cue:"Pieds très écartés, pointes vers l’avant. Penche-toi depuis les hanches et pose les mains au sol, ou sur une chaise si le sol est loin. Le poids sur les mains te laisse écarter les pieds un peu plus à chaque expiration."},
  marche:{n:"Marche genoux hauts",c:"cardio",t:"s",q:30,fr:["kneeA","kneeB"],sp:600,cue:"Marche sur place en montant les genoux à hauteur de hanches, bras actifs. Un pied reste toujours au sol."},
  burpeeM:{n:"Burpees sans saut",c:"cardio",t:"r",q:8,fr:["stand","crouch","plank","crouch"],sp:750,cue:"Mains au sol, recule un pied puis l’autre jusqu’en planche, reviens de la même façon, relève-toi. Ni saut ni pompe."},
  squatC:{n:"Squat sur chaise",c:"jambes",t:"r",q:12,fr:["stand","wallSit"],prop:"chair",cx:30,cue:"Assieds-toi lentement sur la chaise puis relève-toi sans t’aider des mains. Quand c’est facile, effleure juste l’assise."},
  grenouille:{n:"Appui grenouille",c:"fig",t:"s",q:20,fr:["crouch"],cue:"Accroupi, mains au sol, genoux calés contre l’arrière des bras. Bascule du poids vers les mains en gardant les orteils posés. C’est le corbeau avec les petites roues."},
  lateral:{n:"Planche latérale",c:"centre",t:"s",q:30,half:1,fr:["sidePlank"],cue:"Sur le côté, coude sous l’épaule, pieds empilés. Monte le bassin pour aligner la tête, le bassin et les pieds, et tiens. Ça travaille les obliques, le côté de la taille. Change de côté au double bip."},
  lateralG:{n:"Planche latérale, genoux au sol",c:"centre",t:"s",q:30,half:1,fr:["sidePlankG"],cue:"Comme la planche latérale, mais genoux pliés et posés au sol : la ligne va de la tête aux genoux. Monte le bassin sans le laisser tomber vers l’arrière. Change de côté au double bip."},
  deadbug:{n:"Dead bug",c:"centre",t:"r",q:10,even:1,fr:["deadA","deadB","deadA","deadC"],sp:1300,cue:"Sur le dos, bras vers le plafond, genoux pliés au-dessus des hanches. Allonge un bras et la jambe opposée sans décoller le bas du dos, reviens, puis l’autre côté. Le gainage le plus doux pour le dos."},
  birddog:{n:"Bird dog",c:"centre",t:"r",q:10,even:1,fr:["bdA","bdB","bdA","bdC"],sp:1400,cue:"À quatre pattes, mains sous les épaules, genoux sous les hanches. Tends un bras devant et la jambe opposée derrière, sans creuser le dos ni tourner le bassin, tiens une seconde, reviens. Ventre et bas du dos travaillent ensemble."},
  velo:{n:"Crunch vélo",c:"centre",t:"r",q:16,even:1,fr:["veloA","veloB"],sp:1000,cue:"Mains derrière la tête sans tirer sur la nuque, épaules décollées. Amène un genou vers la poitrine en tournant le buste vers lui, puis l’autre, comme si tu pédalais. Lentement : c’est la rotation qui fait travailler les obliques."},
  twist:{n:"Rotations russes",c:"centre",t:"r",q:16,even:1,fr:["twist","twist~"],sp:1100,cue:"Assis, genoux pliés, talons au sol, buste incliné en arrière, dos droit. Tourne les épaules d’un côté puis de l’autre, mains jointes. Pour corser, décolle les pieds du sol."},
  tapsC:{n:"Touches d’épaules sur chaise",c:"centre",t:"r",q:12,even:1,fr:["incl","inclTap"],prop:"chair",cx:67,flip:1,cue:"Mains sur le bord d’une chaise calée contre un mur, corps gainé, pieds écartés. Touche une épaule puis l’autre sans laisser le bassin tourner."},
  genouxAssis:{n:"Rentrés de genoux assis",c:"centre",t:"r",q:12,fr:["sitBack","sitTuck"],prop:"chair",cx:28,sp:900,cue:"Assis au bord de la chaise, mains agrippées à l’assise, buste légèrement en arrière. Ramène les genoux vers la poitrine puis retends les jambes sans poser les pieds."}
};

  if(L===0){add("pompe",["pompeG"]);add("planche",["plancheG"]);add("hollow",["hollowG"]);add("jambes",["genouxAssis","genouxLev"]);add("taps",["tapsC"]);add("lateral",["lateralG"]);add("velo",["deadbug"]);add("twist",["deadbug"]);add("squat",["squatC"]);
    add("pike",["pompeI","chienT","superman"]);add("diamant",["dips","tirage"]);add("mur",["chienT"]);add("corbeau",["grenouille"]);
    add("patineur",["fente"]);add("burpee",["burpeeM"]);add("saute",["squat"]);}
  if(L===3){add("pompe",["pompeArcher"]);add("diamant",["pompeUn"]);add("squat",["pistol"]);add("mur",["atr"]);add("corbeau",["frontLever"]);add("patineur",["unBras","pistol"]);add("pont",["pont1"]);add("superman",["roue"]); if(S.low) R.saute=["pistol"].concat(R.saute||[]);}
  if(S.bar){add("tirage",[["suspension","negative","traction",["archer","traction"]][L]].flat()); if(L>=1) add("jambes",["genouxSusp"]);}
  add("tirage",["rowing"]);
  if(L>=1){add("diamant",["dips"]);add("fente",["bulgare"]);}
  if(S.poign) add("tuck",[L>=2?"lsitP":"tuckP"]);

}
const usable=c=>!!EX[c]&&(EX[c].prop!=="chair"||S.chair)&&(EX[c].prop!=="table"||S.table)&&(!/^bar/.test(EX[c].prop||"")||S.bar)&&(EX[c].prop!=="poign"||S.poign)&&(!EX[c].need||S[EX[c].need]);
function dayInfo(i){
  const w=Math.floor(i/7), d=DAYS[i%7];
  if(d.off) return {d,w,off:true,items:[],steps:[],min:0};
  const f=d.fix?1:LEVELF[S.level]*WEEKF[S.level][w]*S.factor;
  const cardio=d.ty==="Cardio", rest=cardio?CARDIO_OFF[S.level][w]:d.fix?d.rest:Math.max(d.rest||0,S.rest), rounds=d.fix?d.rd[w]:S.level===0&&w<2?2:3;
  const R=d.fix?{}:alts(), taken=new Set(d.it.map(s=>s.split(":")[0]));
  const items=d.it.map(s=>{let [id,ov]=s.split(":");
    const c=(R[id]||[]).find(c=>usable(c)&&!taken.has(c)); if(c){id=c; taken.add(c);}
    let ex=EX[id]; if(ov) ex={...ex,t:ov[0],q:+ov.slice(1)};
    const ff=S.sex==="f"&&ex.c==="haut"&&ex.t==="r"?f*.85:f;
    let a=amount(ex,ff); if(d.cap&&ex.t==="s") a=Math.min(a,d.cap);
    if(cardio){ ex={...ex,t:"s"}; a=CARDIO_ON[S.level][w]; }
    return {id,n:ex.n,t:ex.t,a};});
  const cap=S.level===0&&!d.fix&&!cardio?32:0;
  for(;;){
  const steps=[];
  if(d.warm) [[S.low?"jacksPas":"jacks","s",30],["squat","r",10],["chien","s",30]].concat(S.elast&&/Poussée|Figures/.test(d.n)?[S.level===0?["ecarteE","r",12]:["arcE","r",8]]:[]).forEach(([id,t,a])=>steps.push({id,n:EX[id].n,t,a,rest:10,tag:"Échauffement"}));
  if(steps.length) steps[steps.length-1].rest=20;
  for(let r=1;r<=rounds;r++) items.forEach((it,k)=>{
    const last=k===items.length-1;
    const rr=last&&r<rounds;
    steps.push({...it,rest:rr?Math.max(rest,d.fix?30:ROUND_REST[S.level]):rest,rr,tag:rounds>1?"Tour "+r+" sur "+rounds:d.n});
  });
  if(d.cool&&S.cool){ steps[steps.length-1].rest=30; d.cool.forEach(id=>steps.push({id,n:EX[id].n,t:"s",a:EX[id].q,rest:10,tag:"Retour au calme"})); }
  let sec=6; steps.forEach(s=>sec+=(s.t==="s"?s.a:s.a*3)+s.rest);
  const min=Math.max(5,Math.round(sec/60));
  /* Débutant : au-delà de ~32 min, on retire le dernier exercice du tour plutôt que de rallonger encore. */
  if(cap&&min>cap&&items.length>4){items.pop(); continue;}
  return {d,w,items,steps,rounds,min};
  }
}

      <button class="btn sm alt" id="srst" type="button" style="margin-top:16px">Tout remettre à zéro, profil compris</button>`));
    sh.querySelector("#slev").onchange=e=>{S.level=+e.target.value;save();route();};
    sh.querySelector("#ssex").onchange=e=>{S.sex=e.target.value;saveNow();route();};
    sh.querySelector("#sres").onchange=e=>{S.rest=+e.target.value;save();route();};
    sh.querySelector("#ssnd").onchange=e=>{S.sound=+e.target.value;save();};
    sh.querySelector("#scool").onchange=e=>{S.cool=+e.target.value;save();route();};
    sh.querySelector("#slow").onchange=e=>{S.low=+e.target.value;save();route();};
    sh.querySelector("#sprof").onchange=null; sh.querySelector("#sprof").onclick=()=>{close();profile();};
    sh.querySelector("#schair").onchange=e=>{S.chair=+e.target.value;save();route();};
    sh.querySelector("#stable").onchange=e=>{S.table=+e.target.value;save();route();};
    sh.querySelector("#sbar").onchange=e=>{S.bar=+e.target.value;save();route();};
    sh.querySelector("#spoi").onchange=e=>{S.poign=+e.target.value;save();route();};
    sh.querySelector("#sela").onchange=e=>{S.elast=+e.target.value;save();route();};
    const r=sh.querySelector("#srst"); let armed=false;
    r.onclick=()=>{ if(!armed){armed=true;r.textContent="Confirmer : tout remettre à zéro";return;}
      const t=S.tests, sp=S.splits, g=S.gs; S=fresh(); S.tests=t; S.splits=sp; S.gs=g; saveNow(); close(); route(); profile(); };
  });
}

function choice(sh,label,opts,cur,cls,set){
  sh.append(h(`<p class="lab"></p>`)); sh.lastElementChild.textContent=label;
  const g=document.createElement("div"); g.className="seg "+cls; g.setAttribute("role","group"); g.setAttribute("aria-label",label);
  opts.forEach(([v,t,sub])=>{const b=document.createElement("button"); b.type="button"; b.className="opt"; b.textContent=t;
    if(sub){const sm=document.createElement("small"); sm.textContent=sub; b.append(sm);}
    b.setAttribute("aria-pressed",String(v===cur));
    b.onclick=()=>{g.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); set(v);};
    g.append(b);});
  sh.append(g);
}
function profile(){
  const first=!S.onb, D={level:S.level,sex:S.sex,chair:S.chair,table:S.table,bar:S.bar,poign:S.poign?1:0,elast:S.elast?1:0};
  sheet((sh,close)=>{
    sh.append(h(`<h3>${first?"Bienvenue":"Ton profil"}</h3><p class="note" style="margin:0 0 14px">Quelques questions pour régler le programme sur toi. Tout se modifie plus tard dans Réglages.</p>`));
    choice(sh,"Ton niveau",[[0,"Vraiment débutant","Moins de 3 pompes classiques, ou reprise après une longue pause"],[1,"Quelques bases","Entre 3 et 15 pompes, les squats ne posent pas de souci"],[2,"Intermédiaire","Plus de 15 pompes, dips ou tractions déjà pratiqués"],[3,"Élite","Plus de 30 pompes et une dizaine de tractions strictes"]],D.level,"",v=>D.level=v);
    choice(sh,"Sexe",[["h","Homme"],["f","Femme"],["","Ne pas préciser"]],D.sex,"r3",v=>D.sex=v);
    sh.append(h(`<div class="form" style="grid-template-columns:1fr 1fr"><label>Taille (cm)<input id="ph" type="number" inputmode="numeric" min="120" max="230" value="${S.h||""}"></label><label>Poids (kg)<input id="pk" type="number" inputmode="decimal" min="30" max="250" value="${S.kg||""}"></label></div>`));
    choice(sh,"Une chaise solide sous la main ?",[[1,"Oui"],[0,"Non"]],D.chair,"r2",v=>D.chair=v);
    choice(sh,"Une table lourde qui ne bascule pas ?",[[1,"Oui"],[0,"Non"]],D.table,"r2",v=>D.table=v);
    choice(sh,"Une barre de traction bien fixée ?",[[1,"Oui"],[0,"Non"]],D.bar,"r2",v=>D.bar=v);
    choice(sh,"Des poignées de pompes ?",[[1,"Oui"],[0,"Non"]],D.poign,"r2",v=>D.poign=v);
    choice(sh,"Un extenseur (deux poignées reliées par des tubes) ?",[[1,"Oui"],[0,"Non"]],D.elast,"r2",v=>D.elast=v);
    const b=document.createElement("button"); b.className="btn"; b.type="button"; b.textContent=first?"Créer mon programme":"Enregistrer"; sh.append(b);
    b.onclick=()=>{
      const hh=+sh.querySelector("#ph").value, kg=+sh.querySelector("#pk").value;
      Object.assign(S,D); S.h=hh>=120&&hh<=230?Math.round(hh):0; S.kg=kg>=30&&kg<=250?Math.round(kg*10)/10:0;
      if(S.h&&S.kg&&S.kg/Math.pow(S.h/100,2)>=30) S.low=1;
      if(first) S.rest=REST_DEF[S.level];
      S.onb=1; saveNow(); close(); route(); planSheet();
    };
  });
}
function planSheet(){
  const n=[];
  n.push(["Niveau vraiment débutant : pompes et planche sur les genoux, squats sans saut, appui grenouille à la place du corbeau, deux tours au lieu de trois les deux premières semaines.",
    "Niveau quelques bases : pompes classiques, pompes piquées et premières figures (corbeau, marche au mur).",
    "Niveau intermédiaire : volume plus élevé, pompes pieds surélevés et équerre à la place du soulevé groupé.",
    "Niveau élite : pompes archer et à un bras, squat pistol, pont sur une jambe, pont complet, équerre et équilibre contre le mur. Ce sont des mouvements sur un seul membre : la qualité de chaque répétition compte plus que le nombre, et chaque côté fait sa part."][S.level]);
  n.push("Récupération : "+REST_DEF[S.level]+" s entre deux exercices et "+(ROUND_REST[S.level]>=120?"2 min":ROUND_REST[S.level]+" s")+" entre deux tours. Le bouton « +15 s » te donne du rab quand il en faut.");
  if(S.low) n.push("Séances sans sauts, par défaut : jacks en pas de côté, burpees marchés, marche genoux hauts. Tes genoux et tes chevilles encaissent moins de chocs. Tu peux activer les sauts dans Réglages.");
  if(S.sex==="f") n.push("Volume de départ réduit de 15 % sur les pompes et les dips. C’est une moyenne, pas un verdict : réponds « trop facile » en fin de séance et ça remonte.");
  if(S.chair&&S.level===3) n.push("Avec ta chaise : squat bulgare."); else if(S.chair&&S.level>0) n.push("Avec ta chaise : dips et squat bulgare."); else if(S.chair) n.push("Avec ta chaise : pompes inclinées, squats sur chaise, touches d’épaules et rentrés de genoux assis.");
  if(S.table) n.push("Avec ta table : rowing, le vrai tirage pour le dos, "+(S.bar?"dans le circuit et à la place du superman, puisque la barre prend le tirage.":"dans la séance Jambes et dos et dans le circuit.")+(S.level===0?" Genoux pliés au début, c’est plus facile.":""));
  if(S.bar) n.push(["Avec ta barre : suspension pour construire la prise et les épaules. Les tirages d’omoplates et les négatives viennent ensuite, dans l’onglet Exercices.","Avec ta barre : tractions négatives à la place du tirage au sol, et relevés de genoux suspendu dans le circuit.","Avec ta barre : vraies tractions à la place du tirage au sol, et relevés de genoux suspendu dans le circuit.","Avec ta barre : tractions archer à la place du tirage, front lever groupé à la place du corbeau, et une tentative de traction à un bras par côté dans la séance Figures. Les négatives à un bras, la version assistée à la serviette et la machine à écrire sont dans l’onglet Exercices : c’est avec elles que la traction à un bras se construit, sur des mois."][S.level]);
  if(S.poign) n.push(S.level===3?"Avec tes poignées : équerre sur poignées, plus de hauteur sous les fesses. Les pompes sur poignées restent dans l’onglet Exercices.":S.level===2?"Avec tes poignées : équerre sur poignées, et pompes sur poignées si tu n’as pas de chaise pour surélever les pieds.":"Avec tes poignées : pompes plus profondes, la poitrine passe sous les mains, et soulevé groupé sur poignées."+(S.level===0?" Les pompes restent sur les genoux pour l’instant : les poignées marchent aussi comme ça, dans l’onglet Exercices.":""));
  if(S.elast){const t=S.bar||S.table, z=[]; z.push((S.level===0?"écartés":"tir à l’arc")+" en échauffement des séances Poussée et Figures, pour préparer les épaules"); z.push("ruade à la place de la chaise au mur pour les fessiers"); if(!t) z.push("tirage vertical à la place du tirage au sol"); if(S.level<3) z.push((S.level===0?"écarté":"rowing")+" à la place du superman"); if(!S.table) z.push((S.level===0?"écarté":"rowing")+" dans le circuit"); n.push("Avec ton extenseur : "+z.join(", ")+". Enfin de quoi tirer autant que tu pousses.");}
  n.push("Le module grand écart (10 min) est dans l’onglet Exercices et les jours de repos : 3 à 4 fois par semaine, toujours échauffé.");
  n.push("Après chaque séance, ta réponse (trop facile, juste, trop dur) recale le volume de la suivante.");
  sheet((sh,close)=>{
    sh.append(h(`<h3>Ton programme</h3><ul class="plan"></ul>`));
    n.forEach(t=>{const li=document.createElement("li"); li.textContent=t; sh.querySelector(".plan").append(li);});
    const b=document.createElement("button"); b.className="btn"; b.type="button"; b.textContent="C’est parti"; b.onclick=close; sh.append(b);
  });
}

/* ---------- Lecteur de séance ---------- */
let actx=null, wake=null;
function beep(freq,dur){
  if(!S.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type="triangle"; o.frequency.value=freq; g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.35,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}
async function lock(){try{wake=await navigator.wakeLock.request("screen");}catch(e){}}
function unlock(){try{wake&&wake.release();}catch(e){} wake=null;}
document.addEventListener("visibilitychange",()=>{if(P&&document.visibilityState==="visible") lock();});

function startDay(i){
  const info=dayInfo(i); if(info.off) return; run(i,info.steps);
}
const ROUTINE=["chienT","pinceDebout","fenteBasse","pince","fessier","cobraT","chiot","triceps","enfant"];
const ROUTINE_GE=[["marche",45],["swing",40],["cosaque",40],["fenteBasse",60],["demiGE",60],["pigeon",60],["geAvant",60],["papillon",45],["geAssis",60],["geDebout",45],["enfant",45]];
function startSplits(){ run(-2,ROUTINE_GE.map(([id,a],k)=>({id,n:EX[id].n,t:"s",a,rest:k<3?4:8,tag:k<3?"Échauffement":"Grand écart"}))); }
function startStretch(){ run(-1,ROUTINE.map(id=>({id,n:EX[id].n,t:"s",a:EX[id].q,rest:6,tag:"Étirements"}))); }
function run(i,steps){
  P={day:i,steps:steps,idx:0,phase:"prep",end:Date.now()+10000,paused:false,left:0,last:-1,t0:Date.now(),armed:false};
  P.el=document.createElement("div"); P.el.className="play"; $layer.append(P.el);
  beep(440,.08); lock(); paint();
  P.timer=setInterval(tick,100);
}
function stopPlayer(){ if(!P) return; clearInterval(P.timer); P.el.remove(); P=null; unlock(); route(); }
function tick(){
  if(!P||P.paused||P.phase==="end") return;
  const st=P.steps[P.idx];
  if(P.phase==="work"&&st.t!=="s") return;
  const now=Date.now(), rem=Math.max(0,Math.ceil((P.end-now)/1000));
  if(rem!==P.last){
    P.last=rem; const b=P.el.querySelector("#big"); if(b) b.firstChild.nodeValue=rem;
    if(rem<=3&&rem>0) beep(440,.09);
    if(P.phase==="work"&&EX[st.id].half&&rem===Math.floor(st.a/2)){beep(660,.12);setTimeout(()=>beep(660,.12),180);buzz([40,40,40]);}
  }
  if(now>=P.end) advance();
}
function advance(){
  const st=P.steps[P.idx];
  if(P.phase==="prep"||P.phase==="rest"){
    P.phase="work"; P.last=-1; if(st.t==="s") P.end=Date.now()+st.a*1000;
    beep(880,.22); buzz(80);
  }else{
    if(P.idx>=P.steps.length-1) return finish();
    P.idx++; P.last=-1; beep(660,.18); buzz([60,60,60]);
    if(st.rest>0){P.phase="rest"; P.end=Date.now()+st.rest*1000;}
    else{P.phase="work"; const nx=P.steps[P.idx]; if(nx.t==="s") P.end=Date.now()+nx.a*1000;}
  }
  P.paused=false; paint();
}
function finish(){
  P.phase="end"; clearInterval(P.timer); unlock();
  const m=Math.max(1,Math.round((Date.now()-P.t0)/60000));
  if(P.day>=0){S.done[P.day]={d:today(),m}; save();} else if(P.day===-2){S.gs.push(today()); save();} P.min=m;
  beep(660,.15); setTimeout(()=>beep(880,.15),160); setTimeout(()=>beep(1320,.35),320);
  paint();
}
function paint(){
  const e=P.el, st=P.steps[P.idx]; e.innerHTML="";
  if(P.phase==="end"&&P.day<0){
    e.className="play";
    e.append(h(`<div class="pmid"><p class="when">Étirements terminés, ${P.min} min</p><h1 class="title">Tout est délié</h1><div class="feel"><button class="btn" id="pend" type="button">Terminer</button></div></div>`));
    e.querySelector("#pend").onclick=stopPlayer; return;
  }
  if(P.phase==="end"){
    e.className="play";
    e.append(h(`<div class="pmid"><p class="when">Séance terminée, ${P.min} min</p><h1 class="title">Bien joué</h1>
      <p class="cue">Comment c’était ? Ta réponse ajuste le volume des prochaines séances.</p>
      <div class="feel"><button class="btn alt" data-f="1.08" type="button">Trop facile</button><button class="btn" data-f="1" type="button">Juste ce qu’il faut</button><button class="btn alt" data-f="0.92" type="button">Trop dur</button></div></div>`));
    e.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.factor=Math.min(1.8,Math.max(.5,S.factor*(+b.dataset.f)));save();stopPlayer();});
    return;
  }
  const waiting=P.phase!=="work"; e.className="play"+(waiting?" rest":"");
  const timed=waiting||st.t==="s", rem=timed?Math.max(0,Math.ceil(((P.paused?Date.now()+P.left:P.end)-Date.now())/1000)):0;
  const pct=Math.round(100*(P.idx+(waiting?0:.5))/P.steps.length);
  e.append(h(`<div class="phead"><span class="when"></span><button class="link" id="pq" type="button">Arrêter</button></div>
    <div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
    <div class="pmid"><div id="pfig"></div>
      <p class="when" id="pk"></p><h2 class="pname"></h2>
      <div class="big" id="big" aria-live="off"></div>
      <p class="cue"></p></div>
    <div class="pact" id="pact"></div>`));
  e.querySelector(".phead .when").textContent=st.tag+", "+(P.idx+1)+" sur "+P.steps.length;
  e.querySelector("#pfig").append(figure(st.id,true));
  const resting=P.phase==="rest", rr=resting&&P.steps[P.idx-1]&&P.steps[P.idx-1].rr;
  e.querySelector(".pname").textContent=resting?(rr?"Récupération entre les tours":"Récupération"):st.n;
  e.querySelector("#pk").textContent=P.phase==="prep"?"Prépare-toi, on commence par":"";
  const big=e.querySelector("#big");
  if(timed){big.append(document.createTextNode(rem)); big.append(h(`<small>s</small>`));}
  else{big.append(document.createTextNode("×"+st.a));}
  e.querySelector(".cue").textContent=resting?"Ensuite : "+st.n+", "+(st.t==="s"?st.a+" s":st.a+" fois")+". "+(rr?"Respire, bois un peu, secoue les bras et les jambes.":"Respire calmement et mets-toi en place."):waiting?"":EX[st.id].cue;
  const act=e.querySelector("#pact");
  const btn=(txt,cls,fn)=>{const b=document.createElement("button"); b.type="button"; b.className="btn "+cls; b.textContent=txt; b.onclick=fn; act.append(b); return b;};
  if(waiting){
    btn("+ 15 s","alt",()=>{P.end+=15000;P.last=-1;});
    btn("Passer","",advance);
  }else if(st.t==="s"){
    btn(P.paused?"Reprendre":"Pause","alt",()=>{
      if(P.paused){P.end=Date.now()+P.left;P.paused=false;}else{P.left=P.end-Date.now();P.paused=true;} paint();});
    btn("Passer","alt",advance);
  }else{
    btn("C’est fait","wide",advance);
  }
  const q=e.querySelector("#pq");
  q.onclick=()=>{ if(!P.armed){P.armed=true;q.textContent="Confirmer l’arrêt";setTimeout(()=>{if(P){P.armed=false;const z=P.el.querySelector("#pq"); if(z) z.textContent="Arrêter";}},3000);return;} stopPlayer(); };
  P.armed=false;
}

function fitTabs(){document.querySelectorAll(".tabs a").forEach(a=>{a.style.fontSize=""; let s=parseFloat(getComputedStyle(a).fontSize)||12; while(a.scrollWidth>a.clientWidth&&s>7){s-=.5; a.style.fontSize=s+"px";}});}
route(); if(!S.onb) profile(); initCloud();
fitTabs(); window.addEventListener("resize",fitTabs); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitTabs);
</script>
